<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestorApp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
        }
        
        .logo-circle {
            width: 60px;
            height: 60px;
            background-color: #c8f7dc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .logo-circle i {
            color: #22c55e;
            font-size: 24px;
        }
        
        .btn-sign-in {
            background-color: #22c55e;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
        }
        
        .btn-sign-in:hover {
            background-color: #16a34a;
            color: white;
        }
        
        .form-control, .form-select {
            border-radius: 8px;
            padding: 12px 12px 12px 40px;
            border: 1px solid #e5e7eb;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            z-index: 10;
        }
        
        .form-label {
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }
        
        .sign-up-link {
            color: #111827;
            text-decoration: none;
            font-weight: 600;
        }
        
        .sign-up-link:hover {
            color: #22c55e;
        }
        
        .footer-text {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-circle">
                <i class="bi bi-x-diamond-fill"></i>
            </div>
            
            <h2 class="text-center mb-2">RestorApp</h2>
            <p class="text-center text-muted mb-4">Login to your account</p>
            
            <form>
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full Name</label>
                    <div class="input-group">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="role" class="form-label">Select Role</label>
                    <div class="input-group">
                        <i class="bi bi-briefcase input-icon"></i>
                        <select class="form-select" id="role" style="padding-left: 40px;">
                            <option selected>User</option>
                            <option value="1">Admin</option>
                            <option value="2">Manager</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-sign-in w-100 mb-3">Sign In</button>
                
                <p class="text-center mb-0">
                    Don't have an account? <a href="#" class="sign-up-link">Sign up</a>
                </p>
            </form>
        </div>
        
        <p class="footer-text">RestorApp Academic Simulation</p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
